<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustDisplay 管理後台</title>
  <script>
    /* 深淺色＋字級偏好：與各客戶後台同一組 localStorage 鍵，首繪前套用（admin-kit 規範） */
    (function () {
      try {
        var m = localStorage.getItem('adminColorMode');
        if (m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-color-mode', 'dark');
        var fs = localStorage.getItem('adminFontSize');
        if (fs === 'sm' || fs === 'lg') document.documentElement.setAttribute('data-fs', fs);
      } catch (e) { }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/admin/img/favicon.svg">
  <link rel="apple-touch-icon" href="{{BASE}}/admin/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 入口登入頁＝各客戶後台登入卡同一套樣式（admin-kit＋style.css），portal.css 再換成公司橘 -->
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/tokens.css">
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/shell.css">
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/components.css">
  <link rel="stylesheet" href="{{BASE}}/admin/style.css">
  <link rel="stylesheet" href="{{BASE}}/admin/portal.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card" method="post" action="/portal-login">
      <div class="login-head">
        <div class="login-mark"><img src="{{BASE}}/admin/img/favicon.svg" alt="Justhings 標誌"></div>
        <h2 class="login-title">JustDisplay 管理後台</h2>
        <p class="login-sub">登入以選擇要管理的後台</p>
      </div>
      <label class="b-label">帳號
        <input id="username" name="username" type="text" class="b-input" autocomplete="username" required autofocus>
      </label>
      <label class="b-label">密碼
        <span class="pw-wrap">
          <input id="password" name="password" type="password" class="b-input" autocomplete="current-password" required>
          <button type="button" id="loginPwEye" class="pw-eye" aria-label="顯示密碼" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
        </span>
      </label>
      <button type="submit" class="btn-login"><i data-lucide="log-in" aria-hidden="true"></i><span>登入</span></button>
    </form>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{BASE}}/admin/admin-kit/js/kit.js"></script>
  <script src="{{BASE}}/admin/admin-kit/js/dialogs.js"></script>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var btn = form.querySelector('.btn-login'), label = btn.querySelector('span');
      var pw = document.getElementById('password'), eye = document.getElementById('loginPwEye');
      var toast = function (kind, msg) { if (window.BToast) BToast[kind](msg); else alert(msg); };

      // 沒有 JS 的傳統 POST 失敗會轉回 /?e=1：這裡用同一則 toast 顯示
      var serverError = '{{ERROR}}';
      if (serverError) toast('danger', serverError);

      // 登入流程與各客戶後台（app.js）同一套：按下去填色爬 55%、至少 500ms；成功補滿、350ms 後換頁；
      // 失敗縮回、右下角 danger toast；填色中再按無效。
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (btn.classList.contains('is-loading')) return;
        btn.classList.add('is-loading');
        label.textContent = '登入中…';
        var started = Date.now();
        var minCrawl = function () { return new Promise(function (res) { setTimeout(res, Math.max(0, 500 - (Date.now() - started))); }); };
        try {
          var r;
          try {
            r = await fetch('/portal-login', {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
              body: JSON.stringify({ username: document.getElementById('username').value, password: pw.value }),
            });
          } catch (err) { await minCrawl(); throw new Error('無法登入。目前無法連接伺服器，請檢查網路連線後再試一次。'); }
          if (!r.ok) {
            await minCrawl();
            var body = await r.json().catch(function () { return {}; });
            throw new Error(body.error || '帳號或密碼不正確。');
          }
          await minCrawl();
          btn.classList.add('is-success');
          await new Promise(function (res) { setTimeout(res, 350); });
          try { sessionStorage.setItem('portalLoginToast', '1'); } catch (err) { }
          location.replace('/');   // cookie 已種好，重新載入根網址就是後台清單
        } catch (err) {
          btn.classList.remove('is-loading', 'is-success');
          label.textContent = '登入';
          toast('danger', err.message || '帳號或密碼不正確。');
        }
      });

      // 密碼眼睛（與各客戶後台同款）
      eye.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', show ? 'true' : 'false');
        eye.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
        eye.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" aria-hidden="true"></i>';
        if (window.lucide) lucide.createIcons({ nodes: [eye] });
      });
      if (window.lucide) lucide.createIcons();
    })();
  </script>
</body>
</html>
