<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JustDisplay</title>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/admin/img/favicon.svg">
  <style>
    :root { --brand: #E07800; --fg: #1d1b19; --sub: #6b655f; --line: #e8e2db; --bg: #faf8f5; --card: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #F08A1A; --fg: #f1ece6; --sub: #a59d94; --line: #3a3531; --bg: #1a1816; --card: #24211e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 24px 80px; }
    .logo { height: 40px; display: block; margin-bottom: 28px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
    .lead { color: var(--sub); margin: 0 0 32px; }
    .list { display: grid; gap: 12px; }
    a.card { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    a.card:hover { border-color: var(--brand); transform: translateY(-1px); }
    .card .name { font-weight: 600; font-size: 16px; }
    .card .path { color: var(--sub); font-size: 13px; }
    .card .arrow { margin-left: auto; color: var(--brand); font-size: 18px; }
    footer { margin-top: 48px; color: var(--sub); font-size: 12px; display: flex; align-items: center; gap: 16px; }
    .logout { margin: 0; margin-left: auto; }
    .logout button { font: inherit; font-size: 13px; color: var(--brand); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
    .logout button:hover { border-color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="{{BASE}}/admin/img/JustDisplay-logo.svg" alt="JustDisplay">
    <h1>管理後台</h1>
    <p class="lead">請選擇要進入的後台。</p>
    <div class="list">
      <a class="card" href="{{BASE}}/admin/">
        <div>
          <div class="name">卓也小屋</div>
          <div class="path">{{BASE}}/admin/</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <footer>JustDisplay · Justhings<form method="post" action="/portal-logout" class="logout"><button type="submit">登出</button></form></footer>
  </main>
</body>
</html>
