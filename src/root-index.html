<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustDisplay 管理後台</title>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('adminColorMode');
        if (m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-color-mode', 'dark');
        var fs = localStorage.getItem('adminFontSize');
        if (fs === 'sm' || fs === 'lg') document.documentElement.setAttribute('data-fs', fs);
      } catch (e) { }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/admin/img/favicon.svg">
  <link rel="apple-touch-icon" href="{{BASE}}/admin/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 後台清單頁＝入口登入卡同一個殼（admin-kit＋style.css＋portal.css 公司橘） -->
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/tokens.css">
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/shell.css">
  <link rel="stylesheet" href="{{BASE}}/admin/admin-kit/css/components.css">
  <link rel="stylesheet" href="{{BASE}}/admin/style.css">
  <link rel="stylesheet" href="{{BASE}}/admin/portal.css">
</head>
<body>
  <div class="login-wrap">
    <main class="login-card portal-card">
      <div class="login-head">
        <div class="login-mark"><img src="{{BASE}}/admin/img/favicon.svg" alt="Justhings 標誌"></div>
        <h2 class="login-title">JustDisplay 管理後台</h2>
        <p class="login-sub">請選擇要進入的後台</p>
      </div>
      <nav class="site-list" aria-label="後台清單">
{{CARDS}}
      </nav>
      <form method="post" action="/portal-logout" class="portal-foot">
        <span>JustDisplay · Justhings</span>
        <button type="submit" class="b-btn b-btn-text"><i data-lucide="log-out" aria-hidden="true"></i><span>登出</span></button>
      </form>
    </main>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{BASE}}/admin/admin-kit/js/kit.js"></script>
  <script src="{{BASE}}/admin/admin-kit/js/dialogs.js"></script>
  <script>
    (function () {
      if (window.lucide) lucide.createIcons();
      // 入口登入成功後換到這頁才 toast「登入成功」（與各客戶後台登入後的 flash 同款）
      try {
        if (sessionStorage.getItem('portalLoginToast')) {
          sessionStorage.removeItem('portalLoginToast');
          if (window.BToast) BToast.success('登入成功。');
        }
      } catch (e) { }
    })();
  </script>
</body>
</html>
