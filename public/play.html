<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>{{SITE_NAME}} 展示</title>
  <!-- 純顯示播放頁（2026-09-10，第二個場域 sunrise 起）：Windows 機器用瀏覽器 kiosk 模式開這一頁，
       網址帶機器名與金鑰：/{site}/play/?device=大廳&key=…（金鑰第一次帶過後會記在瀏覽器，之後網址可省略）。
       讀的是和 Android App 同一份 config、同一組 API（/api/config/{id}、/wait 長輪詢、X-Device-Key），
       畫法與後台預覽（app.js buildCanvas）同一套規則，只是尺寸用真實像素。沒有設定頁、沒有 PIN、不做離線快取。 -->
  <link rel="icon" type="image/svg+xml" href="../admin/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../admin/play.css">
  <link rel="stylesheet" href="../admin/assist.css">
</head>
<body data-default-device="{{PLAY_DEFAULT_DEVICE}}">
  <div id="stage" class="stage"></div>

  <!-- 尚未拿到設定：機器名＋狀態 -->
  <div id="boot" class="screen boot">
    <div class="boot-card">
      <div class="boot-mark"><img src="../admin/img/favicon.svg" alt=""></div>
      <div id="bootTitle" class="boot-title">連線中…</div>
      <div id="bootSub" class="boot-sub"></div>
    </div>
  </div>

  <!-- 金鑰不對、後台已移除：說明畫面（可帶按鈕） -->
  <div id="notice" class="screen notice" hidden>
    <div class="boot-card">
      <div class="boot-mark"><img src="../admin/img/favicon.svg" alt=""></div>
      <div id="noticeTitle" class="boot-title"></div>
      <div id="noticeBody" class="boot-sub"></div>
      <div id="noticeActions" class="actions"></div>
    </div>
  </div>

  <!-- 第一次開啟（沒有機器名／金鑰，站台也沒設預設機器名）或左上角連點 5 下：填這面螢幕的名字與金鑰，記在瀏覽器
       （user 2026-09-10 定案：所有機器同一個網址，身分在螢幕上填一次） -->
  <div id="setup" class="screen setup" hidden>
    <form id="setupForm" class="setup-card" autocomplete="off">
      <div class="boot-mark"><img src="../admin/img/favicon.svg" alt=""></div>
      <div class="boot-title" id="setupTitle">這面螢幕叫什麼名字？</div>
      <div class="boot-sub">名字會出現在後台「機器總覽」，之後就用它來發布內容與遠端切頁。只需填一次，這台機器會記住。</div>
      <label class="setup-label">機器名
        <input id="setupName" class="setup-input" type="text" maxlength="64" placeholder="例如：大廳、櫃台、二樓走廊" required>
      </label>
      <label class="setup-label" id="setupKeyRow">連線金鑰
        <input id="setupKey" class="setup-input" type="text" maxlength="128" placeholder="後台側欄「機器連線資訊」的連線金鑰" autocapitalize="off" spellcheck="false">
      </label>
      <div class="actions">
        <button type="button" id="setupCancel" class="btn secondary" hidden>取消</button>
        <button type="submit" id="setupGo" class="btn primary">開始展示</button>
      </div>
    </form>
  </div>

  <!-- 後台還沒編輯這台機器：畫面上留提示（設定進來後自動消失） -->
  <div id="blankHint" class="blank-hint" hidden>
    <span class="material-icons">edit_note</span>
    <div id="blankHintText"></div>
  </div>

  <!-- 「下一頁」：開啟網頁／園區資訊，頂欄＋內容，90 秒沒人碰自動回展示（與 App WebPageScreen／ParkInfoScreen 同） -->
  <div id="overlay" class="overlay" hidden>
    <div class="topbar">
      <button type="button" id="ovBack" class="topbar-btn" aria-label="上一頁"><span class="material-icons">arrow_back</span></button>
      <div id="ovTitle" class="topbar-title"></div>
      <button type="button" id="ovHome" class="topbar-btn" aria-label="回首頁"><span class="material-icons">home</span></button>
    </div>
    <div id="ovBody" class="overlay-body"></div>
  </div>

  <!-- 休眠排程：全黑 -->
  <div id="sleep" class="sleep" hidden></div>

  <!-- 連線狀態小標（斷線時才出現） -->
  <div id="offline" class="offline" hidden><span class="material-icons">cloud_off</span><span id="offlineText">連線中斷，重試中…</span></div>

  <div id="toast" class="toast" hidden></div>

  <script src="../admin/assist.js"></script>
  <script src="../admin/play.js"></script>
</body>
</html>
