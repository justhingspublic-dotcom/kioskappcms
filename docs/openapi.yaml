openapi: 3.0.3
info:
  title: KioskAdmin API
  version: "1.0"
  description: |
    KioskApp 雲端管理後台 API（第一階段：內網版）。

    **呼叫者分兩種：**
    | 呼叫者 | 驗證方式 |
    |---|---|
    | 管理網頁 | 先 `POST /api/login` 拿 token，之後每個請求帶 `Authorization: Bearer <token>`（12 小時失效；伺服器重啟需重新登入） |
    | kiosk 機器 | 每個請求帶 `X-Device-Key`：這台專屬的金鑰（配對碼加入時拿到，或舊機器用共用金鑰換來的），或伺服器 `.env` 的共用金鑰 `DEVICE_KEY`（舊制，永久保留當備援；已確認專屬金鑰的機器不再接受） |

    **權限只分兩級**（2026-09-07 定案）：管理員＝多「帳號管理」與管理 PIN；一般帳號看得到、改得動全部機器，共用設定只能改休眠排程。

    **共通錯誤格式**：所有錯誤都回 `{ "error": "中文說明。" }`；資料庫尚未連上時任何 `/api/*` 一律回 503。

    在右上角「Authorize」填入 token 或 Device Key 後即可直接「Try it out」。
servers:
  - url: /
    description: 目前這台伺服器

tags:
  - name: 登入
    description: 管理網頁登入與目前登入者資訊
  - name: 帳號管理
    description: 限管理員
  - name: 機器
    description: 機器總覽、分配、刪除
  - name: 機器設定
    description: 版本輪詢、長輪詢、讀寫整份設定（網頁與 kiosk 共用）
  - name: 共用設定
    description: 全站一份的版面清單＋客服帳號、休眠排程、管理 PIN 範本
  - name: 檔案
    description: 圖片／影片上傳與下載
  - name: 智能客服
    description: JustAI 代理
  - name: 園區測站
    description: 客戶感測器 API 代理（天氣格「園區測站」來源）
  - name: 操作紀錄
    description: 誰、什麼時候、對哪台機器／帳號做了什麼（限管理員；保留 180 天）
  - name: 配對與金鑰
    description: 配對碼加入新機器、舊機器用共用金鑰換專屬金鑰（2026-10-13）
  - name: 機器事件
    description: App 在機器上記的事件（啟動、閃退、同步失敗／恢復、切頁、休眠、喚醒）批次上傳與查詢；保留 90 天
  - name: 通知
    description: 頂欄鈴鐺（2026-10-14）：挑過的白話通知（機器加入／中斷連線／刪除／離線／恢復／金鑰不符、內容發布與共用設定變更），保留 30 天

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理網頁：`POST /api/login` 回傳的 token
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: kiosk 機器：這台專屬的金鑰，或伺服器 `.env` 的共用金鑰 `DEVICE_KEY`

  responses:
    Unauthorized:
      description: 未登入或 token 已過期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 登入已過期。請重新登入。 }
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 這項操作需要管理員權限。 }
    BadRequest:
      description: 要求格式不正確
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 要求的格式不正確。 }
    DbNotReady:
      description: 資料庫尚未連上（啟動中或公司 DB 斷線）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 正在連接資料庫。請稍候再試一次。 }
    DeviceRemoved:
      description: |
        這台機器已從後台刪除（僅對帶 Device Key 的請求）。機器收到後應自行清空連線設定並關閉同步。
        重新輸入連線資料後第一次請求帶 `X-Device-Fresh: 1` 即可解除。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  removed: { type: boolean, example: true }

  parameters:
    deviceId:
      name: deviceId
      in: path
      required: true
      description: 機器編號（App 設定頁的 Device ID，預設為裝置序號）
      schema: { type: string, maxLength: 64 }
      example: FS003-0001
    userId:
      name: userId
      in: path
      required: true
      description: 帳號 ID（`GET /api/users` 的 `UserId`）
      schema: { type: string, maxLength: 64 }
    deviceFresh:
      name: X-Device-Fresh
      in: header
      required: false
      description: 機器重新輸入連線資料後的第一次請求帶 `1`，會清掉「已刪除」紀錄讓機器重新加入
      schema: { type: string, enum: ["1"] }

  schemas:
    DeviceEvent:
      type: object
      properties:
        at: { type: integer, format: int64, description: 機器上發生的時間（epoch 毫秒） }
        level: { type: string, enum: [info, warn, error] }
        kind: { type: string, description: 事件代碼，例 app.start／app.crash／sync.fail／sync.ok／sync.pull／sync.push／page.switch／display.enter／display.exit／sleep.enter／sleep.exit／sleep.wake／sleep.screen_off_confirmed… }
        message: { type: string, description: 給人看的中文 }
        detail: { type: string, nullable: true, description: 例如閃退堆疊 }
        appVersion: { type: string, nullable: true }
    DeviceEventRow:
      allOf:
        - { $ref: '#/components/schemas/DeviceEvent' }
        - type: object
          properties:
            Id: { type: string }
            At: { type: string, format: date-time }
            ReceivedAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      description: 一筆操作紀錄
      properties:
        Id: { type: string, description: 流水號（字串，當分頁游標用） }
        At: { type: string, format: date-time }
        ActorType: { type: string, enum: [user, device, anonymous, system] }
        ActorId: { type: string, nullable: true }
        ActorName: { type: string, nullable: true, description: 操作者帳號或機器編號 }
        Action: { type: string, description: 動作代碼，以「.」分群，例 login.ok／user.delete／device.delete／config.publish／config.showLayout／shared.layout.create／file.upload／sys.restart }
        TargetType: { type: string, nullable: true, enum: [user, device, layout, shared, file, server] }
        TargetId: { type: string, nullable: true }
        TargetName: { type: string, nullable: true }
        Summary: { type: string, description: 給人看的中文一句話 }
        Detail: { type: object, nullable: true, description: 附加資料（例如 PUT config 改了哪些欄位） }
        Ip: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 中性口吻的中文說明，可直接顯示給使用者
          example: 帳號或密碼不正確。

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "之後放在 `Authorization: Bearer <token>`，12 小時失效" }
        user: { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      properties:
        username: { type: string, example: admin }
        displayName: { type: string, example: 系統管理員, description: 沒設定時為空字串，網頁改顯示 username }
        isAdmin: { type: boolean }

    ConnectionInfo:
      type: object
      properties:
        serverUrl:
          type: string
          example: http://192.168.1.142:3000
          description: "`.env` 的 `PUBLIC_URL`，未設定時以這次請求的 host 推算"
        deviceKey:
          type: string
          description: "`.env` 的 `DEVICE_KEY`（唯讀，更換仍在 `.env` 改並重啟）"
        playDefaultDevice:
          type: string
          description: "`.env` 的 `PLAY_DEFAULT_DEVICE`：播放頁沒帶 ?device= 時用的機器名（空＝網址要帶機器名）"

    User:
      type: object
      properties:
        UserId: { type: string }
        Username: { type: string }
        DisplayName: { type: string, nullable: true }
        IsAdmin: { type: boolean }
        CreatedAt: { type: string, format: date-time }
        IsPrimary: { type: boolean, description: 主管理員（`.env` ADMIN_USERNAME，預設 admin）：不能刪、不能改權限 }
        IsMe: { type: boolean, description: 目前登入者：不能刪自己、不能改自己權限 }

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, format: password }
        displayName: { type: string, maxLength: 128 }
        isAdmin: { type: boolean, default: false }

    UpdateUserRequest:
      type: object
      description: 帶哪個欄位就改哪個；至少要帶一個
      properties:
        displayName: { type: string, maxLength: 128 }
        isAdmin: { type: boolean }

    Device:
      type: object
      properties:
        DeviceId: { type: string }
        DeviceName: { type: string, nullable: true, description: 機器顯示名稱（config 的 `deviceName`） }
        Version: { type: integer, example: 3 }
        UpdatedAt: { type: string, format: date-time }
        OwnerUserId: { type: string, nullable: true, description: 保留欄位，目前不做過濾 }
        OwnerName: { type: string, nullable: true }
        Screen:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Screen' }]
        PageCount: { type: integer }
        ActivePage:
          nullable: true
          description: 目前展示頁的結構（只留 name 與 blocks），供列縮圖
          type: object
          properties:
            name: { type: string }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/Block' }
        LastSeenAgoSec:
          type: integer
          nullable: true
          example: 11
          description: 機器最後一次帶 Device Key 連線距今秒數（記憶體秒級；伺服器重啟後改用 DB 的 LastSeenAt，分鐘級；null＝從沒露面）。網頁以 <60 秒視為在線。
        LastServerUrl:
          type: string
          nullable: true
          example: https://justdisplay.justhings.com.tw
          description: 機器自報「自己填的伺服器位址」（X-Device-Server 標頭，App v1.13 起）；null＝尚未回報。
        LastAppVersion:
          type: string
          nullable: true
          example: "1.13"
          description: 機器自報的 App 版本（X-App-Version 標頭）。
        ServerMatch:
          type: boolean
          nullable: true
          description: 機器填的位址是不是這個後台（與 PUBLIC_URL／請求 host 比對）；null＝尚未回報。false＝機器連在別台伺服器，這裡的變更送不到它。
        KeyMismatch:
          type: boolean
          description: 最近一次連線金鑰錯誤（LastKeyMismatchAt）比最近一次成功露面還新 → 機器目前填的金鑰是錯的。
        LastKeyMismatchAt:
          type: string
          format: date-time
          nullable: true
          description: 最近一次帶錯誤 Device Key 連線的時間（UTC）。
        KeyKind:
          type: string
          enum: [own, pending, shared]
          description: 連線金鑰（2026-10-13）：own＝已換成這台專屬的；pending＝已發出、機器還沒用過；shared＝還在用共用金鑰（舊版 App、網頁播放頁）。
        KeySource:
          type: string
          enum: [pair, exchange]
          nullable: true
          description: 專屬金鑰怎麼來的：pair＝配對碼加入；exchange＝舊機器用共用金鑰換的；null＝沒有專屬金鑰。

    VersionResponse:
      type: object
      properties:
        version: { type: integer, example: 3, description: 該機器沒設定過為 0 }
        themeColor: { type: string, example: "#0051A8", description: "站台主題色 #RRGGBB（2026-09-14）：機器每輪對帳讀到就套用；/wait 回應也帶" }
        parkInfo: { type: object, description: "園區測站（2026-10-20，整個場域共用）：{ api, map: { src, w, h } | null, stations: { 代號: { name, photos, desc, link, x?, y? } } }；後台「共用設定 › 園區測站」設定；/wait、GET /api/config 也帶" }
        keyKind: { type: string, enum: [own, shared], description: "只對機器請求回（2026-10-13）：shared＝這次用的是共用金鑰，新版 App 看到會呼叫 POST /api/devices/{deviceId}/key 換一把專屬的" }

    ConfigResponse:
      type: object
      properties:
        version: { type: integer }
        themeColor: { type: string, example: "#0051A8", description: "站台主題色 #RRGGBB（2026-09-14，後台 nav「主題色」設定）" }
        updatedAt: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/KioskConfig' }

    PutConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          allOf: [{ $ref: '#/components/schemas/KioskConfig' }]
          description: |
            **部分更新（淺合併）**：沒帶的頂層欄位一律沿用舊值。
            所以「更名」只帶 `deviceName`、「複製版面」只帶 `pages`、「套用共用設定」只帶 `chatApi`+`sleep`、網頁存檔不帶 `activePage`（機器不跳頁）。
            `adminPin`、`idleReturnSec` 限管理員；一般帳號送來會被剝掉。

    KioskConfig:
      type: object
      description: 與 App `LayoutTree.kt` 序列化格式一致
      properties:
        activePage: { type: integer, default: 0, description: 目前展示的頁面索引（0 起算） }
        deviceName: { type: string, maxLength: 128, example: 一樓大廳 }
        screen: { $ref: '#/components/schemas/Screen' }
        chatApi: { $ref: '#/components/schemas/ChatApi' }
        sleep: { $ref: '#/components/schemas/SleepSchedule' }
        adminPin: { type: string, description: 機器管理介面 PIN（限管理員設定） }
        idleReturnSec: { type: integer, minimum: -1, maximum: 3600, description: 閒置多少秒回展示頁（限管理員設定；10～3600，後台與 App 的下拉提供 30/60/90/120/180/300/600/1800/3600；-1＝永不（不自動返回）；0 或省略＝預設 90 秒；伺服器會把不合法的值存成 0） }
        pages:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Page' }

    Screen:
      type: object
      properties:
        w: { type: integer, example: 1080 }
        h: { type: integer, example: 1920 }
        inch: { type: number, nullable: true, example: 43, description: 實體吋數（對角線），App v1.45 起自報（EDID／裝置樹／實測 dpi）；機器報不出來時伺服器依 model 查機型表補上；網頁播放頁與舊版 App 沒有 }
        model: { type: string, nullable: true, example: FarBar-YH02, description: 機型（Build.MODEL），App v1.48 起自報 }

    ChatApi:
      type: object
      description: JustAI 智能客服帳號
      properties:
        baseUrl: { type: string, example: https://chat-api.justhings.ai }
        email: { type: string, format: email }
        password: { type: string, format: password }

    SleepSchedule:
      type: object
      description: 與 App DataStore 的 `sleep_schedule_json` 同格式
      properties:
        enabled: { type: boolean }
        sameEveryDay: { type: boolean, description: true 時 App 會把 7 天設成同一時段 }
        experimentalSystemSleep: { type: boolean }
        periods:
          type: array
          items:
            type: object
            properties:
              day: { type: integer, minimum: 1, maximum: 7, description: java.time 慣例：1=週一 … 7=週日 }
              start: { type: integer, minimum: 0, maximum: 1439, description: 凌晨起算的分鐘數 }
              end: { type: integer, minimum: 0, maximum: 1439, description: "`start >= end` 代表跨午夜（隔日結束）" }
            example: { day: 1, start: 1320, end: 480 }

    Page:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string }
        blocks:
          type: array
          description: 直向排列的區塊（後台 2026-10-12 起只寫一個區塊，格子都在它的 node 裡巢狀分割；舊資料的多個區塊仍照權重直向堆疊）
          items: { $ref: '#/components/schemas/Block' }

    Block:
      type: object
      properties:
        id: { type: integer }
        w: { type: number, description: 高度權重（相對值，最小 0.1）, example: 1.0 }
        node: { $ref: '#/components/schemas/Node' }

    Node:
      description: "`t` 為 `cell`（內容格）或 `split`（再切一次，子節點可以再是 split，一路巢狀）"
      oneOf:
        - $ref: '#/components/schemas/Cell'
        - $ref: '#/components/schemas/Split'
      discriminator:
        propertyName: t
        mapping:
          cell: '#/components/schemas/Cell'
          split: '#/components/schemas/Split'

    Split:
      type: object
      required: [t]
      properties:
        t: { type: string, enum: [split] }
        dir: { type: string, enum: [Horizontal, Vertical], description: Horizontal=上下（a 在上）、Vertical=左右（a 在左） }
        ratio: { type: number, minimum: 0.1, maximum: 0.9, example: 0.6 }
        a: { $ref: '#/components/schemas/Node' }
        b: { $ref: '#/components/schemas/Node' }

    Cell:
      type: object
      required: [t]
      properties:
        t: { type: string, enum: [cell] }
        bg: { type: string, enum: [Solid, Image], description: 純色／圖片 }
        bgColor: { type: integer, format: int64, description: ARGB 十進位, example: 4280693816 }
        bgImgs:
          type: array
          items: { type: string }
          description: |
            背景圖清單。`content://…`／`file://…`＝機器本機檔案（無法預覽）；
            `/files/…`／`http(s)://…`＝伺服器檔案，kiosk 會先下載到本機快取再播放。
        scale: { type: string, enum: [Crop, Fit], description: 填滿裁切／完整顯示 }
        dur: { type: integer, description: 圖片輪播秒數, default: 8 }
        content: { type: string, enum: [None, Marquee, Weather, Text, Web, Video] }
        txtColor: { type: integer, format: int64, description: ARGB 十進位；省略＝自動 }
        mqSpeed: { type: integer, default: 100, description: 跑馬燈速度 }
        video: { type: string, description: 影片來源，媒體路徑規則同 `bgImgs` }
        web: { type: string, description: content=Web 時的網址 }
        text: { type: string, description: content=Text／Marquee 的文字 }
        txtPos: { type: string, enum: [TopStart, TopCenter, TopEnd, CenterStart, Center, CenterEnd, BottomStart, BottomCenter, BottomEnd], default: Center, description: content=Text 的文字位置（九宮格） }
        wAuto: { type: boolean, default: true, description: 天氣：自動定位 }
        wCounty: { type: string, description: 天氣：縣市 }
        wDistrict: { type: string, description: 天氣：鄉鎮區 }
        wDynBg: { type: boolean, default: false, description: 天氣：依天況動態背景 }
        wSrc: { type: string, enum: [Standard, Station], default: Standard, description: 天氣資料來源：一般天氣（Open-Meteo）或園區測站（客戶感測器 API） }
        wStUrl: { type: string, description: wSrc=Station 的測站 API 網址 }
        wStation: { type: string, description: wSrc=Station 要顯示的測站代號；空字串＝每 10 秒輪播全部 }
        tap: { type: string, enum: [None, OpenWeb, OpenAssistant, OpenParkInfo, OpenSubPage], description: 點擊動作 }
        sub:
          type: object
          description: tap=OpenSubPage 的子頁（樹狀展示）；node 與頁面的版面樹同格式，主頁算第 1 層、最多 3 層
          properties:
            name: { type: string, description: 子頁名稱（機器上子頁頂欄的標題，空＝「子頁」） }
            node: { type: object, description: 子頁的版面樹（分割或格子） }
            layout: { type: string, enum: [Kiosk, Mobile], default: Kiosk, description: 子頁頂欄（同園區資訊）：KIOSK 放大／手機模式一般大小 }
        tapUrl: { type: string, description: tap=OpenWeb 的網址 }
        agentId: { type: string, description: AI 客服 agent id }
        agentName: { type: string }
        agentAccent: { type: integer, format: int64, description: AI 客服主色 ARGB 十進位；省略＝自動 }
        assistantLayout: { type: string, enum: [Kiosk, Mobile], description: KIOSK展示模式／手機操作模式 }
        agentInputPos: { type: string, enum: [Bottom, Top], default: Top, description: AI 客服輸入區位置：上方（預設；輸入框在頂欄、新問題釘在上面）／下方（原本） }

    SharedSettingsResponse:
      type: object
      properties:
        settings:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SharedSettings' }]
        updatedAt: { type: string, format: date-time, nullable: true }

    PutSharedSettingsRequest:
      type: object
      required: [settings]
      properties:
        settings: { $ref: '#/components/schemas/SharedSettings' }

    SharedSettings:
      type: object
      description: 欄位皆可省略。一般帳號的 PUT 只會套用 `sleep`，其他欄位保留現值。
      properties:
        layouts:
          type: array
          items: { $ref: '#/components/schemas/Layout' }
        chatApi: { $ref: '#/components/schemas/ChatApi' }
        sleep: { $ref: '#/components/schemas/SleepSchedule' }
        adminPin: { type: string }
        idleReturnSec: { type: integer, description: 閒置返回秒數範本（10～3600 或 -1＝永不；0 或省略＝不覆蓋） }

    Layout:
      type: object
      description: 一個版面＝一頁（`pages` 長度 1）
      properties:
        id: { type: integer }
        name: { type: string }
        pages:
          type: array
          maxItems: 1
          items: { $ref: '#/components/schemas/Page' }
        screen: { $ref: '#/components/schemas/Screen' }
        createdBy: { type: string, readOnly: true, description: 伺服器在 PUT 時對新出現的版面蓋章（＝登入者顯示名稱） }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time }

    JustAiAgentsRequest:
      type: object
      required: [baseUrl, email, password]
      description: 即 config 裡的 `chatApi`
      properties:
        baseUrl: { type: string, example: https://chat-api.justhings.ai }
        email: { type: string, format: email }
        password: { type: string, format: password }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }

    UploadResponse:
      type: object
      properties:
        id: { type: string, description: 檔案 ID（隨機 UUID） }
        url:
          type: string
          example: /files/3f2a9c0d1e2f4a5b8c9d0e1f2a3b4c5d.jpg
          description: "**相對路徑**；顯示或下載時組成 `{serverUrl}/files/<檔名>`"

    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }

paths:
  /api/login:
    post:
      tags: [登入]
      summary: 登入
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: 登入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        "401":
          description: 帳號或密碼不正確
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 帳號或密碼不正確。 }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/me:
    get:
      tags: [登入]
      summary: 目前登入者
      description: 每次都從 DB 讀，名稱／權限被別的管理員改了，重整就看到
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/connection-info:
    get:
      tags: [登入]
      summary: 機器連線資訊
      description: 側欄底部「機器連線資訊」卡片用，所有登入者都可看，方便在機器上抄填
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionInfo' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/health:
    get:
      tags: [登入]
      summary: 程序健康狀態（不需登入）
      description: |
        保母程序（src/supervisor.js）每 15 秒打這支確認後台程序還會回應；DB 沒連上也回 200（內容的 db 欄位看得出來）。
        內容：pid、uptimeSec、priority（程序優先權）、loop（事件迴圈延遲 p50／p99／max，毫秒）、cpuPct、mem、db 心跳。不含機密。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok: { type: boolean }
                  pid: { type: integer }
                  uptimeSec: { type: integer }
                  priority: { type: string, nullable: true }
                  winPriority:
                    type: object
                    nullable: true
                    description: Windows 才有。調整後的 CPU 優先權類別、I/O 優先權（2＝正常）、記憶體優先權（5＝正常）、常駐記憶體下限與是否已鎖定；調整失敗時只有 error
                    properties: { cpu: { type: string }, io: { type: integer }, mem: { type: integer }, wsMinMB: { type: integer }, wsHard: { type: boolean }, error: { type: string } }
                  loop: { type: object, properties: { p50: { type: integer }, p99: { type: integer }, max: { type: integer } } }
                  cpuPct: { type: integer }
                  pageFaults: { type: integer, description: 最近 15 秒的分頁錯誤數 }
                  mem: { type: object, properties: { rssMB: { type: integer }, heapMB: { type: integer } } }
                  db: { type: object, properties: { ok: { type: boolean, nullable: true }, ms: { type: integer, nullable: true }, failures: { type: integer }, lastOkAt: { type: string, nullable: true } } }

  /api/users:
    get:
      tags: [帳號管理]
      summary: 帳號清單
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }
    post:
      tags: [帳號管理]
      summary: 新增帳號
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        "200":
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
        "400":
          description: 缺帳號／密碼，或名稱含無效字元
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 請填寫帳號和密碼。 }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409":
          description: 帳號名稱重複
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 這個帳號名稱已被使用。 }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/users/{userId}:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    put:
      tags: [帳號管理]
      summary: 編輯帳號（名稱／權限）
      description: 主管理員與自己的 `isAdmin` 不能改。改了權限，該帳號已登入的 token 立刻生效。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "400":
          description: 沒帶任何欄位、名稱含無效字元、或試圖改主管理員／自己的權限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                self: { value: { error: 無法變更目前登入帳號的權限。 } }
                primary: { value: { error: 無法變更主管理員的權限。 } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: 帳號不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 這個帳號已不存在。 }
        "503": { $ref: '#/components/responses/DbNotReady' }
    delete:
      tags: [帳號管理]
      summary: 刪除帳號
      description: 主管理員、自己不能刪。該帳號名下的機器改為未分配。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "400":
          description: 試圖刪主管理員或自己
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                self: { value: { error: 這是目前登入的帳號。 } }
                primary: { value: { error: 主管理員無法刪除。 } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/devices:
    get:
      tags: [機器]
      summary: 機器清單
      description: 所有登入者都拿到全部機器。每列附「目前展示頁」結構與螢幕比例供縮圖，整份 config 不外送。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/devices/wait:
    get:
      tags: [機器]
      summary: 機器清單變動長輪詢（後台機器總覽）
      description: |
        帶上次拿到的版次 `rev`；版次不同立刻回，相同就掛著，清單有變（機器加入、移除、設定版本變、在線↔離線、有新通知）立刻回，最多 25 秒。
        `events`＝這段期間的機器加入／中斷連線／被刪除（含誰做的，網頁據此跳 toast；只留記憶體最近 50 筆，`rev=0` 時不回）。
        `notifRev`＝通知版次，變了就重抓 `GET /api/notifications`。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: rev, in: query, schema: { type: integer }, description: 上次拿到的版次；第一次給 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
                  notifRev: { type: integer }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        rev: { type: integer }
                        type: { type: string, enum: [joined, left, deleted] }
                        deviceId: { type: string }
                        name: { type: string }
                        at: { type: string, format: date-time }
                        by:
                          type: object
                          properties:
                            kind: { type: string, enum: [device, user] }
                            username: { type: string }
                            displayName: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/notifications:
    get:
      tags: [通知]
      summary: 鈴鐺通知清單
      description: 最近 30 天、最新 100 筆，加上這個帳號讀到哪裡（`readAt`）。內容類（Kind=content）網頁只顯示別人做的；同一個 GroupKey 時間相鄰的網頁合成一則。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  readAt: { type: string, format: date-time, nullable: true }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        Id: { type: string }
                        At: { type: string, format: date-time }
                        Kind: { type: string, enum: [device, content] }
                        Type: { type: string, description: joined／left／deleted／offline／online／keyMismatch／renamed／published／switchPage／appendLayout／showLayout／applySettings／sharedLayout／sharedSettings }
                        DeviceId: { type: string, nullable: true }
                        Text: { type: string, description: 白話一句（不含句號） }
                        ActorUsername: { type: string, nullable: true }
                        ActorName: { type: string, nullable: true }
                        GroupKey: { type: string, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/read:
    post:
      tags: [通知]
      summary: 全部標為已讀（打開鈴鐺時呼叫）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { readAt: { type: string, format: date-time } } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/devices/{deviceId}/owner:
    parameters: [{ $ref: '#/components/parameters/deviceId' }]
    put:
      tags: [機器]
      summary: 分配機器給帳號（保留）
      description: 目前權限模型不做過濾，此 API 保留給未來「只看自己的機器」使用。`userId` 傳 null＝收回為未分配。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/devices/{deviceId}:
    parameters: [{ $ref: '#/components/parameters/deviceId' }]
    delete:
      tags: [機器]
      summary: 刪除機器
      description: |
        刪掉設定列並記進「已刪除」名單；掛在 `/wait` 的機器會被叫醒，下一個請求收到 410 後自行清空連線設定。
        機器重新輸入連線資料後帶 `X-Device-Fresh: 1` 即可重新加入。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/pair/start:
    post:
      tags: [配對與金鑰]
      summary: 機器開始配對（登記 6 位數配對碼）
      description: |
        不用登入（機器還沒有任何憑證）。配對碼 10 分鐘有效（另有 1 分鐘寬限），到期機器自己再登記一組。同一來源最多同時 10 組、全站 200 組。
        App 1.58 起機器自己產號碼（code），拿同一組去 GET /api/sites 列出的每個場域登記：在哪個場域的後台輸入，機器就連到那裡，其他場域的登記由機器取消。
        已經連在本場域的機器（按了重新配對）帶 `current`＋`X-Device-Key` 證明自己：金鑰對得上、後台清單裡也有它，後台查這組號碼時就回 `existing`、不新增第二台。
        連在別的場域的機器只帶 `currentSite`（場域名稱），後台取名時提醒新增後會從那邊移除。兩者都不帶＝新機器（舊版 App）。
      parameters:
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: 帶 current 時一起帶，這台目前的連線金鑰 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: "482913", description: 機器自己產的 6 位數；本站已有人用回 409，機器換一組重來。沒帶＝伺服器產 }
                suggestedId: { type: string, description: 機器建議的編號（機型-ANDROID_ID 後四碼）；有人用了伺服器會加尾碼 }
                model: { type: string, description: 機型，後台輸入配對碼時顯示給人確認 }
                current: { type: string, description: 機器目前在本場域的編號（只送給它目前連的場域）；金鑰不對或清單裡沒有＝當新機器 }
                currentSite: { type: string, example: 卓也小屋, description: 機器目前連在別的場域：那個場域的名稱 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairId: { type: string, description: 只有這台機器知道的配對編號，用來等結果 }
                  code: { type: string, example: "482913" }
                  expiresInSec: { type: integer, example: 600 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409":
          description: 這組配對碼在本站已有人使用，機器換一組重來
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429":
          description: 申請太多次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "503": { $ref: '#/components/responses/DbNotReady' }
  /api/pair/{pairId}/wait:
    get:
      tags: [配對與金鑰]
      summary: 機器等配對結果（長輪詢，最多 25 秒）
      parameters:
        - { name: pairId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: waiting＝還沒有人輸入，再掛一次；done＝配對完成，帶這台的編號、名稱與專屬金鑰；already＝後台輸入了，但這台本來就在本場域（沒有新增），機器收起配對碼、維持原本的連線
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [waiting, done, already] }
                  deviceId: { type: string }
                  deviceName: { type: string }
                  deviceKey: { type: string }
        "404":
          description: 配對碼已過期（或伺服器重啟過），機器應重新申請
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/pair/{pairId}:
    delete:
      tags: [配對與金鑰]
      summary: 機器離開配對畫面，這組配對碼立刻作廢
      parameters:
        - { name: pairId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /api/pair/code/{code}:
    get:
      tags: [配對與金鑰]
      summary: 後台查配對碼是哪台機器
      description: 這台本來就在本場域時回 `existing`（不能新增），同時通知機器（它的長輪詢收到 already）、這組號碼隨即作廢。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: "482913" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: { type: string }
                  suggestedId: { type: string }
                  currentSite: { type: string, description: 機器目前連在別的場域（場域名稱）；新增後會從那邊移除 }
                  expiresInSec: { type: integer }
                  existing:
                    type: object
                    description: 只有這台本來就在本場域時才有（其他欄位不帶）
                    properties:
                      deviceId: { type: string }
                      name: { type: string, description: 機器總覽上的名稱 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: 找不到（打錯、過期或已用掉）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/pair/claim:
    post:
      tags: [配對與金鑰]
      summary: 後台輸入配對碼新增機器
      description: 配好機器編號、發這台專屬的金鑰並叫醒正在等的機器；配對碼隨即作廢。機器收到後自己開始同步，幾秒內出現在機器總覽。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: "482913" }
                name: { type: string, example: 一樓大廳 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  deviceName: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: 找不到（打錯、過期或已用掉）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: 這台本來就在本場域（沒先查碼就直接新增時）；不新增，機器那邊同樣收到 already
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/devices/{deviceId}/key:
    post:
      tags: [配對與金鑰]
      summary: 機器用共用金鑰換一把專屬金鑰
      description: |
        只收共用金鑰，而且這台還沒確認過專屬金鑰（`/version` 回 `keyKind: shared` 時 App 自動呼叫）。
        發出的金鑰要等機器第一次用它連上才生效「共用金鑰不能再代表這台」；在那之前共用金鑰照常能用，換到一半斷線也不影響。
      security: [{ deviceKey: [] }]
      parameters: [{ $ref: '#/components/parameters/deviceId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceKey: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }
  /api/devices/{deviceId}/disconnect:
    post:
      tags: [配對與金鑰]
      summary: 機器自己中斷連線（從這個場域的後台移除）
      description: App「中斷連線」時呼叫，效果同後台刪除這台（設定列刪掉、記為已移除）。機器已先清掉自己的連線設定。
      security: [{ deviceKey: [] }]
      parameters: [{ $ref: '#/components/parameters/deviceId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
  /api/devices/{deviceId}/key/reset:
    post:
      tags: [配對與金鑰]
      summary: 重設連線金鑰（限管理員）
      description: 作廢這台的專屬金鑰。舊機器會用留著的共用金鑰自己再換一把；用配對碼加入的機器要到現場重新配對。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/deviceId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }
  /api/devices/{deviceId}/events:
    post:
      tags: [機器事件]
      summary: 機器上傳事件批次
      description: App 每輪同步後把本機佇列裡的事件送上來（一次最多 500 筆）；伺服器只存，不回傳內容。已從後台移除的機器回 410。
      security: [{ deviceKey: [] }]
      parameters: [{ $ref: '#/components/parameters/deviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items: { $ref: '#/components/schemas/DeviceEvent' }
      responses:
        "200":
          description: 已收
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  accepted: { type: integer }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }
    get:
      tags: [機器事件]
      summary: 查某台機器的事件
      description: 限管理員；由新到舊、游標分頁（nextBefore 有值＝還有更舊的）。後台沒有頁面，這支給工程師查。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: before, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, description: 事件代碼；結尾帶「.」＝前綴（例 sleep.） }
        - { name: level, in: query, schema: { type: string, enum: [info, warn, error] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceEventRow' }
                  nextBefore: { type: string, nullable: true }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/audit:
    get:
      tags: [操作紀錄]
      summary: 操作紀錄查詢
      description: 由新到舊；一次最多 200 筆。回應的 nextBefore 有值＝還有更舊的，下一頁把它當 before 帶回來。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: before, in: query, schema: { type: string }, description: 只拿比這個 Id 更舊的（分頁游標） }
        - { name: action, in: query, schema: { type: string }, description: 動作代碼；結尾帶「.」＝前綴（例 config. 拿所有機器設定類） }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string }, description: 例如某台機器編號 }
        - { name: actor, in: query, schema: { type: string }, description: 操作者名稱（完全相符） }
        - { name: q, in: query, schema: { type: string }, description: 摘要／操作者／對象名稱關鍵字 }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 不含 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextBefore: { type: string, nullable: true }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/assist/{deviceId}/agent:
    get:
      tags: [智能客服]
      summary: 客服資料（網頁播放器用，機器金鑰）
      description: 後台用這台機器 config 裡的 chatApi 帳號登入 JustAI，回客服名稱、頭像、問候語、建議問題、主題色、附件旗標。src/assist.js。
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409": { description: 這台機器還沒有設定智能客服帳號（notConfigured=true） }
        "502": { description: JustAI 平台錯誤（error 為中文原因） }
  /api/assist/{deviceId}/threads:
    get:
      tags: [智能客服]
      summary: 歷史對話清單（機器金鑰）
      description: 這組客服帳號跟該客服的所有對話串，新到舊；只有問候語沒提問的空串不列。回 [{ id, title, createdAt }]。2026-09-14，同 App。
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "[{ id, title, createdAt }]" }
        "400": { description: 沒有指定客服 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { description: JustAI 平台錯誤（error 為中文原因） }
    post:
      tags: [智能客服]
      summary: 開對話串（機器金鑰）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ id }" }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/assist/{deviceId}/threads/{threadId}/messages:
    get:
      tags: [智能客服]
      summary: 某一串的完整訊息，舊到新（載回歷史對話用；機器金鑰）
      description: "回 [{ fromUser, content, isGreeting, attachments:[{ name, fileUrl, isImage }] }]，fileUrl 已轉成絕對網址。"
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: threadId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: 訊息陣列 }
        "400": { description: 沒有指定客服 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { description: JustAI 平台錯誤（error 為中文原因） }
    post:
      tags: [智能客服]
      summary: 送訊息，回 SSE 串流（機器金鑰）
      description: "body：{ content, attachments:[{attachmentId}] }；回 text/event-stream，每行 data: {\"content\":\"增量\",\"done\":false}，JustAI 原樣轉送。"
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: threadId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: SSE 串流 }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/assist/{deviceId}/threads/{threadId}/jobs:
    post:
      tags: [智能客服]
      summary: 送訊息（輪詢版）：立刻回 { jobId }，伺服器自己收 JustAI 串流；播放頁用這支（IIS 會緩衝 SSE）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: threadId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ jobId }" }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/assist/{deviceId}/jobs/{jobId}:
    get:
      tags: [智能客服]
      summary: 取工作目前累積的回覆（每 0.3 秒輪詢）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ text, done, error }" }
        "404": { description: 找不到這個工作（已清掉或不是這台機器的） }
    delete:
      tags: [智能客服]
      summary: 停止工作（訪客按停止／關閉）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok }" }
  /api/assist/{deviceId}/attachments:
    post:
      tags: [智能客服]
      summary: 上傳附件（multipart file，≤20MB，依客服旗標；機器金鑰）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ attachmentId, type, name, fileUrl, mimeType }" }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/assist/preview:
    get:
      tags: [智能客服]
      summary: 連結預覽 og:title／og:image（機器金鑰）
      security: [{ deviceKey: [] }]
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ url, host, title, imageUrl }" }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/logout:
    post:
      tags: [登入]
      summary: 登出（把 token 作廢）
      description: 2026-09-10 起登入工作階段存 DB（伺服器重啟不會登出），所以登出要通知伺服器把 token 拿掉；沒呼叫也會在 12 小時後過期。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/restart:
    post:
      tags: [登入]
      summary: 重啟後台（限管理員）
      description: |
        回 200 後 0.5 秒結束後台子程序，保母程序 2 秒內重拉（本機直接跑 node 的話就只是關掉）。
        body `{ "supervisor": true }`＝連保母一起結束，由 run.cmd 迴圈 5 秒內重拉保母；部署改了 src/supervisor.js 或 src/win-priority.js 時要用。
        部署蓋完檔案後呼叫這支即可，工具：`node tools/restart-prod.js [網址] [--supervisor]`。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                supervisor: { type: boolean, description: true＝連保母程序一起重啟 }
      responses:
        "200":
          description: 已排定重啟
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/config/{deviceId}/version:
    parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/deviceFresh'
    get:
      tags: [機器設定]
      summary: 查版本號
      description: kiosk 定期輪詢；版本比本機記錄的大才抓整份設定。伺服器為 0 時 kiosk 會用 PUT 上傳本機設定當初始值。
      security: [{ bearerAuth: [] }, { deviceKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/config/{deviceId}/wait:
    parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/deviceFresh'
    get:
      tags: [機器設定]
      summary: 長輪詢等新版本
      description: |
        帶目前版本 `version`；伺服器版本不同立刻回，相同則最多掛 25 秒，網頁一發布（或機器被刪除）立刻回應。
        逾時回目前版本，kiosk 收到後直接再掛一次。
      security: [{ bearerAuth: [] }, { deviceKey: [] }]
      parameters:
        - name: version
          in: query
          required: false
          description: kiosk 本機目前的版本號（省略視為 0）
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: 有新版本、機器被刪除（version 0），或逾時
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/config/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/deviceFresh'
    get:
      tags: [機器設定]
      summary: 讀整份設定
      description: kiosk 拿到後先把所有遠端媒體下載到快取，全部下載完才套用（避免畫面破圖）。
      security: [{ bearerAuth: [] }, { deviceKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: 這台機器還沒有任何設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 這台機器還沒有任何設定。 }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }
    put:
      tags: [機器設定]
      summary: 存整份設定（部分更新）
      description: |
        版本自動 +1（第一次寫入為 1），並立刻叫醒掛在 `/wait` 的機器。
        網頁「儲存並發布」、更名、複製版面、套用共用設定，以及 kiosk 第一次連線上傳本機設定、機器本機改設定回推，都走這支。

        **淺合併**：沒帶的頂層欄位一律沿用舊值。`adminPin` 限管理員，一般帳號送來會被剝掉。
      security: [{ bearerAuth: [] }, { deviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutConfigRequest' }
            examples:
              rename:
                summary: 只更名
                value: { config: { deviceName: 一樓大廳 } }
              applyShared:
                summary: 套用共用設定
                value:
                  config:
                    chatApi: { baseUrl: https://chat-api.justhings.ai, email: a@b.c, password: "***" }
                    sleep: { enabled: true, sameEveryDay: false, experimentalSystemSleep: false, periods: [{ day: 1, start: 1320, end: 480 }] }
              full:
                summary: 整份版面
                value:
                  config:
                    activePage: 0
                    screen: { w: 1080, h: 1920 }
                    pages:
                      - id: 1
                        name: ""
                        blocks:
                          - id: 1
                            w: 1.0
                            node: { t: cell, bg: Image, bgImgs: ["/files/3f2a9c.jpg"], scale: Crop, dur: 8, content: None, tap: None }
                          - id: 2
                            w: 2.0
                            node:
                              t: split
                              dir: Vertical
                              ratio: 0.6
                              a: { t: cell, bg: Solid, bgColor: 4280693816, content: Weather, wAuto: true }
                              b: { t: cell, bg: Solid, bgColor: 4280693816, content: Marquee, text: 歡迎光臨, mqSpeed: 100 }
      responses:
        "200":
          description: 已儲存，回傳新版本號
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
              example: { version: 4 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "410": { $ref: '#/components/responses/DeviceRemoved' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/shared-settings:
    get:
      tags: [共用設定]
      summary: 讀共用設定
      description: 全站一份，不分帳號。還沒設定過時 `settings` 為 null。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedSettingsResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { $ref: '#/components/responses/DbNotReady' }
    put:
      tags: [共用設定]
      summary: 寫共用設定
      description: |
        - **管理員**：整份覆寫；新出現的版面 id 由伺服器蓋上 `createdBy`／`createdAt`。
        - **一般帳號**：只套用 `sleep`，其他欄位保留現值；沒帶 `sleep` 回 403。

        「加入機器／套用」不經伺服器特別處理，網頁端逐台 `PUT /api/config/{deviceId}` 帶部分欄位即可。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutSharedSettingsRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/justai/agents:
    post:
      tags: [智能客服]
      summary: 拉客服清單（伺服器代打 JustAI）
      description: 瀏覽器直呼 JustAI 會被 CORS 擋，由伺服器登入拿 token 後轉呼 `GET /api/agents`。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JustAiAgentsRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        "400":
          description: 缺欄位或位址格式不正確
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 請填寫智能客服的伺服器位址、Email 和密碼。 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502":
          description: JustAI 登入失敗、無法取得清單或連不上
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 無法登入智能客服平台。請檢查帳號和密碼。 }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/station/current:
    get:
      tags: [園區測站]
      summary: 代抓園區測站 API（天氣格「園區測站」來源）
      description: |
        後台預覽與測站清單要讀客戶的感測器 API（例：卓也小屋 joyeCloud `/api/telemetry/current`），
        對方沒開 CORS，由伺服器代抓並快取 10 秒，原樣回傳對方的 JSON。
        期望格式：`{ stations: [ { station_id, name, status|online, received_at_local, values: { temperature, humidity, pm25, hourly_rainfall, daily_rainfall } } ] }`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
          example: https://joye.justhings.com.tw/api/telemetry/current
      responses:
        "200":
          description: 對方 API 的原始 JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: 網址格式不正確
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 測站 API 網址格式不正確。請以 http:// 或 https:// 開頭。 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502":
          description: 對方 API 連不上、逾時或回的不是 JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 無法連接測站 API。請檢查網址和網路連線。 }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /api/upload:
    post:
      tags: [檔案]
      summary: 上傳圖片／影片
      description: 網頁登入者或 kiosk 機器皆可。檔名改為隨機 UUID；上限 500 MB。機器不支援的圖片格式（AVIF、HEIC、BMP、TIFF、SVG…）會轉成 JPG／PNG 再存，回傳副檔名以轉檔後為準。
      security: [{ bearerAuth: [] }, { deviceKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 已上傳
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        "400":
          description: 沒有選擇檔案，或圖片格式無法轉檔
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 沒有選擇檔案。 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { $ref: '#/components/responses/DbNotReady' }

  /files/{filename}:
    get:
      tags: [檔案]
      summary: 下載檔案
      description: 公開，不需驗證（檔名為隨機 UUID）。回應帶一年快取；kiosk 從這裡把媒體抓回本機。
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
          example: 3f2a9c0d1e2f4a5b8c9d0e1f2a3b4c5d.jpg
      responses:
        "200":
          description: 檔案內容
          content:
            image/*: { schema: { type: string, format: binary } }
            video/*: { schema: { type: string, format: binary } }
        "404":
          description: 檔案不存在
